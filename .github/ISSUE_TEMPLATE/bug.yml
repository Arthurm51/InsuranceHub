name: 🐞 Bug
description: Reportar um defeito encontrado
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Descreva o defeito com detalhes suficientes para que qualquer pessoa consiga reproduzi-lo.
        Campos marcados com * são obrigatórios.

  - type: input
    id: resumo
    attributes:
      label: Resumo
      description: Uma frase com o que está errado e onde.
      placeholder: Cotação de Auto no plano Premium aplica franquia de 4% em vez de 2%
    validations:
      required: true

  - type: input
    id: rastreabilidade
    attributes:
      label: Regra ou história relacionada
      description: ID da regra de negócio e/ou história de usuário afetada.
      placeholder: RN-03, US-04
    validations:
      required: true

  - type: dropdown
    id: severidade
    attributes:
      label: Severidade
      description: Impacto técnico do defeito no sistema.
      options:
        - Crítica — bloqueia fluxo principal, perda de dados ou falha de segurança, sem contorno
        - Alta — funcionalidade importante com resultado errado, contorno difícil
        - Média — funcionalidade com comportamento incorreto, mas com contorno
        - Baixa — problema cosmético, texto ou layout, sem impacto no resultado
    validations:
      required: true

  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade
      description: Urgência para o negócio corrigir.
      options:
        - Alta — corrigir antes da próxima entrega
        - Média — corrigir na sprint atual ou na seguinte
        - Baixa — corrigir quando houver capacidade
    validations:
      required: true

  - type: textarea
    id: ambiente
    attributes:
      label: Ambiente
      description: Onde o defeito foi encontrado.
      value: |
        - Execução: local / CI
        - Commit ou versão:
        - Navegador e versão (se E2E):
        - Viewport (se E2E): desktop / mobile
    validations:
      required: true

  - type: textarea
    id: pre-condicoes
    attributes:
      label: Pré-condições
      description: Estado necessário antes dos passos (usuário, massa de dados, mock da OPIN).
      placeholder: Logado como demo@insurehub.com, sem apólice de Auto ativa
    validations:
      required: false

  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: resultado-esperado
    attributes:
      label: Resultado esperado
      description: O que deveria acontecer, de preferência citando a regra.
    validations:
      required: true

  - type: textarea
    id: resultado-obtido
    attributes:
      label: Resultado obtido
      description: O que aconteceu de fato (status HTTP, mensagem, valor exibido).
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidência
      description: Prints, logs, request/response, trace do Playwright ou link do relatório Allure. Arraste arquivos para cá.
    validations:
      required: false
