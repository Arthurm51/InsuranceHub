server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: insurehub-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurehub}
    username: ${DB_USER:insurehub}
    password: ${DB_PASSWORD:insurehub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

insurehub:
  jwt:
    # Valor de desenvolvimento. Em qualquer ambiente real, sobrescrever via JWT_SECRET.
    secret: ${JWT_SECRET:insurehub-dev-secret-change-me-0123456789-abcdefghij}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  security:
    max-failed-logins: 5
    lock-minutes: 15
  opin:
    base-url: ${OPIN_BASE_URL:http://localhost:8089}
    timeout-ms: ${OPIN_TIMEOUT_MS:3000}
    fresh-cache-minutes: 15
    fallback-cache-hours: 24
  seed:
    enabled: ${SEED_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
